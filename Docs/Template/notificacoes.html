{{>header}}
<section class="cabecalho-pagina">
  <h1>Notificações</h1>
  <p>{{naoLidas}} não lidas</p>
</section>
<form method="post" action="/notificacoes/todas" class="inline">
  <input type="hidden" name="csrf" value="{{csrf}}">
  <button class="botao secundario" type="submit">Marcar todas como lidas</button>
</form>

<section class="lista">
  {{#notificacoes}}
  <article class="cartao notificacao">
    <p class="etiqueta">{{tipo}} · {{criadaEm}} · {{#lida}}lida{{/lida}}{{^lida}}nova{{/lida}}</p>
    <p>{{texto}}</p>
    <p>
      <a class="botao" href="{{link}}">Abrir</a>
      <form method="post" action="/notificacoes/{{id}}/lida" class="inline">
        <input type="hidden" name="csrf" value="{{csrf}}">
        <button class="link" type="submit">Marcar como lida</button>
      </form>
    </p>
  </article>
  {{/notificacoes}}
  {{^notificacoes}}<p class="vazio">Nenhuma notificação.</p>{{/notificacoes}}
</section>
{{>footer}}
