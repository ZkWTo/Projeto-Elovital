{{>header}}
<section class="cabecalho-pagina">
  <h1>Recuperar senha</h1>
  <p>Por segurança, a resposta é sempre a mesma, exista ou não o e-mail.</p>
</section>
<form class="formulario cartao estreito" method="post" action="/esqueci-minha-senha">
  <label for="email">E-mail</label>
  <input id="email" name="email" type="email" required autocomplete="email">
  <button class="botao grande" type="submit">Enviar link</button>
  <p class="dica">O link vale 1 hora e só pode ser usado uma vez.</p>
</form>
{{#mensagem}}
<section class="cartao" role="status">
  <p>{{mensagem}}</p>
  {{#linkDemo}}<p class="dica">Ambiente de demonstração — link gerado: <a href="{{linkDemo}}">abrir redefinição</a>.</p>{{/linkDemo}}
</section>
{{/mensagem}}
{{>footer}}
