{{>header}}
<section class="cabecalho-pagina">
  <h1>Definir nova senha</h1>
  <p>O link é de uso único e expira em 1 hora.</p>
</section>
<form class="formulario cartao estreito" method="post" action="/redefinir-senha">
  <input type="hidden" name="token" value="{{token}}">
  <label for="senha">Nova senha</label>
  <input id="senha" name="senha" type="password" minlength="10" required autocomplete="new-password">
  <label for="confirmacao">Confirme a nova senha</label>
  <input id="confirmacao" name="confirmacao" type="password" minlength="10" required autocomplete="new-password">
  <button class="botao grande" type="submit">Redefinir</button>
</form>
{{>footer}}
